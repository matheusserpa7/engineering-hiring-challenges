name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs: a tag can be moved to different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The reviewer's path, exactly: copy the example env, build, wait for every healthcheck.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:4000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/ | grep -q '<div id="app">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs: a tag can be moved to different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The reviewer's path, exactly: copy the example env, build, wait for every healthcheck.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:4000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/ | grep -q '<div id="app">'
      # Through nginx, so a broken proxy path fails here. The totals are derived from the seed;
      # the list at its maximum size must carry no email and not row 5's name (anonymous).
      - name: Public campaign API
        run: |
          curl -fsS http://localhost:3000/api/campaigns/aangan-courtyard > campaign.json
          grep -q '"raisedCents":4305800' campaign.json
          grep -q '"donorCount":46' campaign.json
          curl -fsS 'http://localhost:3000/api/campaigns/aangan-courtyard/donations?limit=50' > donations.json
          ! grep -q '@' donations.json
          ! grep -q 'Ramesh Thapa' donations.json
      # The two numbers from the seed README: 75 rows, and 4,305,800 cents of completed gifts
      # for the Aangan campaign. The psql runs inside the db container, so it uses the same
      # credentials the stack was started with. A restart seeds again and must change neither:
      # the second check is on the money, not only the row count.
      - name: Seed data survives a restart
        run: |
          psql_db() {
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "$1"' _ "$1"
          }
          check_seed() {
            test "$(psql_db 'select count(*) from donations')" = 75
            test "$(psql_db "select sum(d.amount_cents)::bigint from donations d join campaigns c on c.id = d.campaign_id where c.slug = 'aangan-courtyard' and d.status = 'completed'")" = 4305800
          }
          check_seed
          docker compose restart api
          docker compose up --wait --wait-timeout 120
          check_seed
      # Shared's runtime dependency (zod) has to be in the image, not only in the workspace.
      - name: Shared package loads in the image
        run: docker compose exec -T api node -e "import('@aangan/shared')"
      # A real gift through nginx: 201 with a receipt, the same key replayed with the header and
      # the same body, and the total moved by exactly the gift. Runs after the restart check
      # because it adds a row to the seed. `raised` reads the field with node, not jq or grep,
      # so key order in the JSON cannot matter.
      - name: Donation intake
        run: |
          api=http://localhost:3000/api
          raised() {
            curl -fsS "$api/campaigns/aangan-courtyard" |
              node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).raisedCents"
          }
          key=$(node -p "crypto.randomUUID()")
          body='{"campaignSlug":"aangan-courtyard","amountCents":10100,"donor":{"fullName":"CI Donor","email":"ci@example.com"},"privacyMode":"public","paymentToken":"tok_ok"}'
          give() {
            curl -sS -D "$1.headers" -o "$1.json" -w '%{http_code}' -X POST "$api/donations" \
              -H 'Content-Type: application/json' -H "Idempotency-Key: $key" -d "$body"
          }
          before=$(raised)
          test "$(give first)" = 201
          grep -q '"receiptNumber":"HCC-2026-' first.json
          test "$(give replay)" = 201
          grep -qi '^idempotent-replayed: true' replay.headers
          cmp first.json replay.json
          test "$(raised)" = "$((before + 10100))"
      # Login, ownership and the admin guard through nginx, with the seeded demo accounts. The
      # 404 for another donor's row is checked next to a control: the admin reads that same id
      # with 200, so the 404 is the ownership rule and not a wrong id. Nothing is refunded here.
      - name: Login and ownership
        run: |
          api=http://localhost:3000/api
          origin='Origin: http://localhost:3000'
          login() {
            body="{\"email\":\"$1@himalayacc.example\",\"password\":\"$2\"}"
            test "$(curl -sS -o /dev/null -w '%{http_code}' -c "$1.jar" -X POST "$api/auth/login" \
              -H "$origin" -H 'Content-Type: application/json' -d "$body")" = 200
          }
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          login admin admin12345
          login donor donor12345
          grep -q HttpOnly admin.jar
          test "$(curl -fsS -b donor.jar "$api/me/donations" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).data.length")" = 3
          other=$(curl -fsS -b admin.jar --get --data-urlencode 'q=other@himalayacc' "$api/admin/donations" |
            node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).data[0].id")
          test "$(code -b donor.jar "$api/donations/$other")" = 404
          test "$(code -b admin.jar "$api/donations/$other")" = 200
          test "$(code -b donor.jar "$api/admin/donations")" = 403
          test "$(code "$api/admin/donations")" = 401
          test "$(code -b donor.jar -X POST -H 'Origin: https://evil.example' "$api/auth/logout")" = 403
          # गुरुङ, percent-encoded so no locale can turn it into question marks.
          curl -fsS -b admin.jar "$api/admin/donations?q=%E0%A4%97%E0%A5%81%E0%A4%B0%E0%A5%81%E0%A4%99" |
            grep -q 'HCC-2026-000002'
      # nginx answers some requests itself, before the API sees them: an undecodable percent
      # escape and an oversized body. Those must be the same JSON envelope the API sends, so
      # each is compared byte for byte with the API's own answer on :4000.
      - name: nginx errors
        run: |
          bad='/api/campaigns/%E0%A4%A'
          { printf '{"x":"'; head -c 70000 /dev/zero | tr -c a a; printf '"}'; } > big.json
          test "$(curl -sS -o web400 -w '%{http_code}' "http://localhost:3000$bad")" = 400
          test "$(curl -sS -o api400 -w '%{http_code}' "http://localhost:4000$bad")" = 400
          cmp web400 api400
          # logout has no limiter, so this costs none of the rate-limit budget.
          for port in 3000 4000; do
            test "$(curl -sS -o "out$port" -w '%{http_code}' -X POST "http://localhost:$port/api/auth/logout" \
              -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
              --data-binary @big.json)" = 413
          done
          cmp out3000 out4000
          grep -q payload_too_large out3000
      # A session the server never issued is refused, and a real one stops working once its
      # expiry has passed. The expiry is moved by SQL: no TTL setting exists just for this test.
      # The row is expired before the first 401 is read, so the 200 before it is the control.
      - name: Sessions
        run: |
          api=http://localhost:3000/api
          code() { curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          forged=$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n')
          test "${#forged}" = 43
          test "$(code -H "Cookie: aangan_session=$forged" "$api/auth/me")" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -c expiring.jar -X POST "$api/auth/login" \
            -H 'Origin: http://localhost:3000' -H 'Content-Type: application/json' \
            -d '{"email":"donor@himalayacc.example","password":"donor12345"}')" = 200
          test "$(code -b expiring.jar "$api/auth/me")" = 200
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "$1"' _ \
            "update sessions set expires_at = now() - interval '1 second' where donor_id = (select id from donors where email = 'donor@himalayacc.example')"
          curl -sS -b expiring.jar "$api/auth/me" -o expired.json -w '%{http_code}' | grep -qx 401
          grep -q '"code":"unauthenticated"' expired.json
      # The mock provider's two failure tokens, through nginx. A decline is a 402. A timeout is
      # a 202 with the donation still pending: the money may have moved, so it is never failed. --max-time is above the API's own 5 s provider timeout.
      - name: Payment outcomes
        run: |
          api=http://localhost:3000/api
          give() {
            curl -sS --max-time 8 -o "$1.json" -w '%{http_code}' -X POST "$api/donations" \
              -H 'Content-Type: application/json' -H "Idempotency-Key: $(node -p 'crypto.randomUUID()')" \
              -d "{\"campaignSlug\":\"aangan-courtyard\",\"amountCents\":2500,\"donor\":{\"fullName\":\"CI Outcome\",\"email\":\"ci@example.com\"},\"privacyMode\":\"public\",\"paymentToken\":\"$2\"}"
          }
          test "$(give decline tok_decline)" = 402
          grep -q '"code":"card_declined"' decline.json
          test "$(give timeout tok_timeout)" = 202
          grep -q '"status":"pending"' timeout.json
      # Last, because it exhausts the buckets for every later request from this address. Wrong
      # passwords until the login limit answers, then key-less POSTs (each a 400 before any
      # charge) until the donation limit does. The caps leave room for earlier steps' requests,
      # so this proves the limits fire within the defaults, not their exact values.
      - name: Rate limits
        run: |
          api=http://localhost:3000/api
          hit() {
            max=$1; shift
            for i in $(seq 1 "$max"); do
              status=$(curl -sS -D limit.headers -o limit.json -w '%{http_code}' "$@")
              test "$status" = 429 && return 0
            done
            return 1
          }
          hit 21 -X POST "$api/auth/login" -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' -d '{"email":"nobody@himalayacc.example","password":"wrong-password"}'
          grep -q '"code":"rate_limited"' limit.json
          grep -qi '^retry-after: [0-9]' limit.headers
          hit 31 -X POST "$api/donations" -H 'Content-Type: application/json' -d '{}'
          grep -q '"code":"rate_limited"' limit.json
          grep -qi '^retry-after: [0-9]' limit.headers
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

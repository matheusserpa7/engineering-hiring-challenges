server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Redirects such as /api → /api/ must not name the container's port 8080.
    absolute_redirect off;
    root /usr/share/nginx/html;

    # The errors nginx generates itself use the API's envelope, byte for byte (CI compares them
    # with :4000). An undecodable percent escape fails URI parsing before any location is
    # chosen, so this is set for the whole server, and a named location cannot be used there
    # (nginx has no URI to redirect from), hence internal paths. proxy_intercept_errors stays off, so the
    # API's own 4xx and 5xx pass through untouched.
    error_page 400 /_errors/400;
    error_page 413 /_errors/413;
    location = /_errors/400 {
        internal;
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        return 400 '{"error":{"code":"bad_request","message":"The request could not be processed."}}';
    }
    location = /_errors/413 {
        internal;
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        return 413 '{"error":{"code":"payload_too_large","message":"The request body is too large."}}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Docker's embedded DNS. With a literal hostname in proxy_pass, nginx resolves `api` once
    # at startup, and a recreated API container with a new IP gets 502s until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # A variable makes nginx resolve per request. With no URI part, the original request URI
    # is passed unchanged, so /api/health reaches the API as /api/health.
    # The API sets its own security headers (helmet), so none are added here.
    location /api/ {
        # The API's own limit is 16 kB, so 1 MB is no reason to buffer.
        client_max_body_size 64k;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA. Unknown paths fall back to index.html so client-side routes survive a reload.
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # A missing bundle is a 404, not index.html: a stale page asking for an old hash
        # would otherwise get HTML as JavaScript, which nosniff turns into a blank page.
        # No add_header here, so the headers above are inherited.
        location /assets/ {
            try_files $uri =404;
        }
    }
}

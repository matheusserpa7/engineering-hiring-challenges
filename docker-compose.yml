services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${DB_PORT:-5433}:5432
    healthcheck:
      # TCP, not the socket: on first start the image's init server listens on the socket
      # only, then restarts, and a socket check could pass in between.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Inside the compose network the database is db:5432. Only tools on the host (npm run
      # dev, psql) reach it through localhost:${DB_PORT}.
      DATABASE_URL: postgres://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The site is reached through nginx on WEB_PORT, as localhost or 127.0.0.1. A request that
      # changes state from any other origin gets a 403.
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Same defaults as config.ts, so change them together. Passed on so a QA burst or repeated e2e runs can raise them.
      DONATION_RATE_LIMIT: ${DONATION_RATE_LIMIT:-30}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:${API_PORT:-4000}:4000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:8080

volumes:
  dbdata:
